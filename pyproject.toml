[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyconvis"
version = "0.1.0"
description = "Interactive 3D Spacetime Concurrency & Parallelism Visualizer for Python (asyncio, GIL threading, and Free-Threaded Python 3.14t)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
pyconvis = "pyconvis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyconvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
